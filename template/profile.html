<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Profile</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
     <header class="header-center">
        <h2>Jam Finder</h2>
        <a class="black-a right-side" href="homepage.html">back to home</a>
    </header>
    <div href="profile.html" class="align-center">
            <img class="make-profile" src="/static/reno_rude.jpg" alt="user profile picture in a circle shape">
            <!-- <input class="make-profile" type="file"> -->
    </div>
    <input class="profile-inputs" type="text" placeholder="Name">
    <input class="profile-inputs" type="number" placeholder="Age">
    <input class="profile-inputs" type="text" placeholder="Gender">
    <select class="instruments" name="genre" id="genre">
        <option value="genre">
            Instrument
        </option>
        <option value="rock">
            Bass
        </option>
        <option value="punk">
            Vocals
        </option>
        <option value="alternative">
            Drums
        </option>
        <option value="pop">
            Guitar
        </option>
        <option value="metal">
            Violin
        </option>
        <option value="electronic">
            Harpsichord
        </option>
        <option value="nu-metal">
            Double Bass
        </option>
    <input class="profile-description" type="text" placeholder="About me">
    <button class="genre-tag">Add Genre</button>
    <button type="submit" id="submit-btn">Save</button>
</body>
</html>
